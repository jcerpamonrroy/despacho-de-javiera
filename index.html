300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPb94C-s0.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ec14fa24-ae19-4e5f-9804-41e23260672c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F4EFE4}\n.dj{--p:#F4EFE4;--w:#FFFDF8;--t:#18263B;--m:#4F5A69;--r:#B3261E;--rl:#F6E3DF;--y:#F3DC5A;--b:#2D5BD3;--bl:#E3EAFB;--line:rgba(24,38,59,.14);--h:'Space Grotesk',system-ui,sans-serif;--f:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}\n.dj a{color:#2D5BD3}.dj a:hover{color:#18263B}\n.dj button{font-family:inherit}\n.dj button:focus-visible,.dj a:focus-visible,.dj input:focus-visible{outline:3px solid #2D5BD3;outline-offset:2px}\n.hl{background:linear-gradient(transparent 55%,#F3DC5A 55%)}\n@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-14deg)}60%{opacity:1;transform:scale(.92) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}\n@keyframes dashflow{to{stroke-dashoffset:-12}}\n@keyframes fly{0%{offset-distance:0%}45%,55%{offset-distance:100%}100%{offset-distance:0%}}\n.cg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}\n@media (max-width:720px){.cg{grid-template-columns:repeat(2,minmax(0,1fr))}.cg>:first-child{grid-column:1/-1}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"dj\" style=\"min-height:100vh;background:var(--p);color:var(--t);font-family:var(--f);font-size:16px;line-height:1.55\" data-canvas-width=\"1280\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"El Despacho de Javiera\">\n\n<header style=\"border-bottom:1px solid var(--line);background:var(--w)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px\">\n<a href=\"#recepcion\" style=\"display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--t)\">\n<span style=\"width:40px;height:40px;border-radius:50%;border:2.5px solid var(--r);color:var(--r);display:grid;place-items:center;font-family:var(--h);font-weight:700;font-size:14px;transform:rotate(-10deg)\">JC<\u002Fspan>\n<span style=\"font-family:var(--h);font-weight:700;font-size:19px;letter-spacing:-.01em\">El Despacho de Javiera<\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Departamentos\" style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n<a href=\"{{ n.href }}\" sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"min-height:40px;padding:0 12px;border-radius:999px;display:flex;align-items:center;font-size:14px;font-weight:600;text-decoration:none;background:{{ n.bg }};color:{{ n.color }}\">{{ n.label }}<\u002Fa>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<section id=\"recepcion\" style=\"max-width:1180px;margin:0 auto;padding:80px 24px 72px;display:flex;flex-direction:column;gap:22px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--r);font-weight:700\">Recepci\u00f3n \u00b7 Senior PM \u00b7 Vertical de contabilidad<\u002Fspan>\n<h1 style=\"margin:0;font-family:var(--h);font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-.03em\">Bienvenido al Despacho de Javiera. <span class=\"hl\">Tu caso ya est\u00e1 abierto.<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:clamp(18px,1.8vw,22px);color:var(--m)\">Hemos preparado tu requerimiento a partir de la oferta publicada y puedes completarlo con lo que necesites. Cada necesidad se atiende en uno de nuestros departamentos: Contable, Fiscal, Laboral, Ventanilla IA y Legal. En cada uno, coge las partidas que te interesen y a\u00f1\u00e1delas a tu expediente. Al final te entregamos la factura, sin coste.<\u002Fp>\n<div style=\"display:flex;padding-top:6px\"><a href=\"#requerimiento\" style=\"min-height:54px;padding:0 24px;border-radius:12px;background:var(--t);color:var(--w);font-weight:700;font-size:17px;display:flex;align-items:center;text-decoration:none\">Ver tu requerimiento \u2192<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"requerimiento\" style=\"background:var(--w);border-block:1px solid var(--line)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;gap:24px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--r);font-weight:700\">Paso 01 \u00b7 Requerimiento<\u002Fspan>\n<h2 style=\"margin:0;font-family:var(--h);font-size:clamp(30px,3.8vw,44px);line-height:1.1;letter-spacing:-.02em\">Tu requerimiento, <span class=\"hl\">generado a partir de la oferta.<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;color:var(--m);font-size:17px\">Lo hemos redactado con los requisitos de la oferta publicada de Senior Product Manager para la vertical de contabilidad. Cada punto lo atiende el departamento que mejor le corresponde. \u00bfEchas algo en falta? A\u00f1\u00e1delo y te decimos qui\u00e9n lo atiende.<\u002Fp>\n<ol style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px\">\n<sc-for list=\"{{ list }}\" as=\"it\" hint-placeholder-count=\"8\">\n<li style=\"background:var(--p);border-radius:12px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:flex-start\">\n<span style=\"font-family:var(--mono);font-size:13px;color:var(--r);font-weight:700;padding-top:3px\">{{ it.num }}<\u002Fspan>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-weight:600\">{{ it.text }}<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<sc-for list=\"{{ it.chips }}\" as=\"c\" hint-placeholder-count=\"1\">\n<a href=\"{{ c.href }}\" style=\"min-height:32px;padding:0 10px;border-radius:999px;background:var(--bl);color:var(--b);font-size:13px;font-weight:600;display:flex;align-items:center;text-decoration:none\">{{ c.label }}<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ it.remove }}\" aria-label=\"{{ it.removeLabel }}\" style=\"width:36px;height:36px;border:none;border-radius:8px;background:transparent;color:var(--m);cursor:pointer;font-size:18px\">\u00d7<\u002Fbutton>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end\">\n<label style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">A\u00f1adir un punto al requerimiento\n<input ref=\"{{ reqRef }}\" sc-camel-on-key-down=\"{{ reqKey }}\" name=\"req\" autocomplete=\"off\" placeholder=\"Ej.: experiencia con n\u00f3mina\" style=\"min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--w);padding:0 14px;font:inherit;font-weight:400;color:var(--t)\">\n<\u002Flabel>\n<button type=\"button\" sc-camel-on-click=\"{{ addItem }}\" style=\"min-height:48px;padding:0 18px;border-radius:10px;border:none;background:var(--t);color:var(--w);font-weight:700;cursor:pointer\">A\u00f1adir<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ resetList }}\" style=\"min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--t);font-weight:600;cursor:pointer\">Restablecer<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contable\" style=\"max-width:1180px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--r);font-weight:700\">Dpto. 01 \u00b7 Contable<\u002Fspan>\n<h2 style=\"margin:0;font-family:var(--h);font-size:clamp(30px,3.8vw,44px);line-height:1.1;letter-spacing:-.02em\">Cuentas claras: <span class=\"hl\">el problema antes que la funcionalidad.<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;color:var(--m);font-size:17px\">Trabajo muy cerca de los usuarios. Hago discovery, prototipo y valido antes de construir, priorizo con Ingenier\u00eda, Data y negocio, y mido despu\u00e9s de cada lanzamiento. Lo llevo como un ejercicio contable que se cierra\u2026 para volver a abrirse.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:var(--w);border-radius:18px;border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n<h3 style=\"margin:0;font-family:var(--h);font-size:22px\">Cierre del ejercicio de producto<\u002Fh3>\n<span style=\"font-family:var(--mono);font-size:13px;color:var(--m)\">Asiento {{ stepNum }} de 5<\u002Fspan>\n<\u002Fdiv>\n<div style=\"overflow-x:auto\"><div role=\"tablist\" aria-label=\"Fases\" style=\"display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px;min-width:780px\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n<button role=\"tab\" aria-selected=\"{{ s.sel }}\" sc-camel-on-click=\"{{ s.pick }}\" style=\"min-height:72px;border-radius:1 <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px\">\n<sc-for list=\"{{ dContable }}\" as=\"p\" hint-placeholder-count=\"6\">\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column\">\n<div style=\"padding:16px;display:flex;flex-direction:column;gap:8px;flex:1\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700\">{{ p.ref }}<\u002Fspan><h4 style=\"margin:0;font-family:var(--h);font-size:17px;line-height:1.25;min-height:2.5em;display:flex;align-items:flex-start\">{{ p.n }}<\u002Fh4><p style=\"margin:0;font-size:14px;color:var(--m)\">{{ p.d }}<\u002Fp><\u002Fdiv>\n<div style=\"padding:10px 12px;border-top:1px dashed var(--line);display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.pressed }}\" style=\"min-height:40px;padding:0 12px;border-radius:10px;border:{{ p.btnBorder }};background:{{ p.btnBg }};color:{{ p.btnColor }};font-weight:700;font-size:14px;cursor:pointer\">{{ p.btnLabel }}<\u002Fbutton><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"fiscal\" style=\"background:var(--t);color:var(--w)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--y);font-weight:700\">Dpto. 02 \u00b7 Fiscal<\u002Fspan>\n<h2 style=\"margin:0;font-family:var(--h);font-size:clamp(30px,3.8vw,44px);line-height:1.1;letter-spacing:-.02em\">Declaraci\u00f3n de resultados. <span style=\"color:var(--y)\">Todo lo que lanzo, lo declaro con datos.<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;color:#C9D1DD;font-size:17px\">El marco de m\u00e9tricas que uso en Alegra Bot, presentado como un modelo tributario. Haz clic en cada casilla para ding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:500\">Llevar iniciativas transversales de principio a fin y dise\u00f1ar pensando en quien las usa: el programa de pr\u00e1cticas que dise\u00f1\u00e9 qued\u00f3 5\u00ba en el ranking BIE de First Job.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:700\">DataLab<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top\">Consultora<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-family:var(--mono);text-align:center;white-space:nowrap\">02/2020<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-family:var(--mono);text-align:center;white-space:nowrap\">08/2021<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--m)\">An\u00e1lisis cuantitativos y cualitativos para Anglo American, BHP, SAESA, SURA y Grupo Qui\u00f1enco, traducidos en planes de acci\u00f3n para equipos C-level.<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:500\">Pasar del diagn\u00f3stico a la acci\u00f3n: convertir entrevistas, focus groups y datos en planes concretos y defenderlos ante quien decide.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px\">\n<div style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px\">\n<h3 style=\"margin:0;font-family:var(--h);font-size:19px\">Titulaciones<\u002Fh3>\n<p style=\"margin:0\"><strong>M\u00e1ster en Trabajo y Empleo<\u002Fstrong><br><span style=\"color:var(--m);font-size:14px\">Universidad Complutense de Madrid \u00b7 2022\u20132023<\u002Fspan><\u002Fp>\n<p style=\"margin:0\"><strong>Ingenier\u00eda Comercial (ADE + Econom\u00eda)<\u002Fstrong><br><span style=\"color:var(--m);font-size:14px\">Pontificia Universidad Cat\u00f3lica de Chile \u00b7 2015\u20132019<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:8px\">\n<h3 style=\"margin:0;font-family:var(--h);font-size:19px\">Formaci\u00f3n acreditada<\u002Fh3>\n<sc-for list=\"{{ edu }}\" as=\"e\" hint-placeholder-count=\"5\"><div style=\"display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px\"><span><strong>{{ e.t }}<\u002Fstrong> \u00b7 {{ e.o }}<\u002Fspan><span style=\"font-family:var(--mono);color:var(--m);white-space:nowrap\">{{ e.d }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<h3 style=\"margin:8px 0 0;font-family:var(--h);font-size:20px\">Partidas de este departamento<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px\">\n<sc-for list=\"{{ dLaboral }}\" as=\"p\" hint-placeholder-count=\"3\">\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column\">\n<div style=\"padding:16px;display:flex;flex-direction:column;gap:8px;flex:1\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700\">{{ p.ref }}<\u002Fspan><h4 style=\"margin:0;font-family:var(--h);font-size:17px;line-height:1.25;min-height:2.5em;display:flex;align-items:flex-start\">{{ p.n }}<\u002Fh4><p style=\"margin:0;font-size:14px;color:var(--m)\">{{ p.d }}<\u002Fp><\u002Fdiv>\n<div style=\"padding:10px 12px;border-top:1px dashed var(--line);display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.pressed }}\" style=\"min-height:40px;padding:0 12px;border-radius:10px;border:{{ p.btnBorder }};background:{{ p.btnBg }};color:{{ p.btnColor }};font-weight:700;font-size:14px;cursor:pointer\">{{ p.btnLabel }}<\u002Fbutton><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ventanilla\" style=\"background:var(--bl);border-block:1px solid var(--line)\">\n<div style=\"max-width:1180px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--b);font-weight:700\">Ventanilla IA \u00b7 C\u00f3mo se construy\u00f3 este despacho<\u002Fspan>\n<h2 style=\"margin:0;font-family:var(--h);font-size:clamp(30px,3.8vw,44px);line-height:1.1;letter-spacing:-.02em\">Este sitio se construy\u00f3 con IA a partir de un prompt. <span class=\"hl\">Pero el prompt fue el \u00faltimo paso del pensamiento, no el primero.<\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<ol aria-label=\"Proceso\" style=\"margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center\"><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--w);color:var(--t);border:1.5px solid var(--line)\">Problema<\u002Fli><li aria-hidden=\"true\" style=\"color:var(--b);font-weight:700\">\u2192<\u002Fli><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--w);color:var(--t);border:1.5px solid var(--line)\">Outcome<\u002Fli><li aria-hidden=\"true\" style=\"color:var(--b);font-weight:700\">\u2192<\u002Fli><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--w);color:var(--t);border:1.5px solid var(--line)\">Hip\u00f3tesis<\u002Fli><li aria-hidden=\"true\" style=\"color:var(--b);font-weight:700\">\u2192<\u002Fli><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--b);color:#fff\">Prompt<\u002Fli><li aria-hidden=\"true\" style=\"color:var(--b);font-weight:700\">\u2192<\u002Fli><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--w);color:var(--t);border:1.5px solid var(--line)\">Prototipo<\u002Fli><li aria-hidden=\"true\" style=\"color:var(--b);font-weight:700\">\u2192<\u002Fli><li style=\"padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--w);color:var(--t);border:1.5px solid var(--line)\">Iteraci\u00f3n<\u002Fli><\u002Fol>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--b);font-weight:700;letter-spacing:.1em\">PROBLEMA<\u002Fspan><p style=\"margin:0;font-size:15px\">Quien revisa candidaturas lee muchos CV que dicen \u00abproducto con IA\u00bb, pero un CV afirma y no demuestra.<\u002Fp><\u002Farticle>\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--b);font-weight:700;letter-spacing:.1em\">OUTCOME<\u002Fspan><p style=\"margin:0;font-size:15px\">Que el equipo de producto gane confianza en mi forma de pensar y construir, y que avancemos a una conversaci\u00f3n.<\u002Fp><\u002Farticle>\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--b);font-weight:700;letter-spacing:.1em\">HIP\u00d3TESIS<\u002Fspan><p style=\"margin:0;font-size:15px\">\u00abCreemos que un prototipo interactivo, pensado para vuestra vertical, demuestra mejor c\u00f3mo trabajo que un PDF, porque se experimenta en vez de solo leerse. Sabremos que es cierto si me invit\u00e1is a conversar.\u00bb<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<h3 style=\"margin:8px 0 0;font-family:var(--h);font-size:20px\">Partidas de esta ventanilla<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px\">\n<sc-for list=\"{{ dIA }}\" as=\"p\" hint-placeholder-count=\"2\">\n<article style=\"background:var(--w);border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column\">\n<div style=\"padding:16px;display:flex;flex-direction:column;gap:8px;flex:1\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--b);font-weight:700\">{{ p.ref }}<\u002Fspan><h4 style=\"margin:0;font-family:var(--h);font-size:17px;line-height:1.25;min-height:2.5em;display:flex;align-items:flex-start\">{{ p.n }}<\u002Fh4><p style=\"margin:0;font-size:14px;color:var(--m)\">{{ p.d }}<\u002Fp><\u002Fdiv>\n<div style=\"padding:10px 12px;border-top:1px dashed var(--line);display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.pressed }}\" style=\"min-height:40px;padding:0 12px;border-radius:10px;border:{{ p.btnBorder }};background:{{ p.btnBg }};color:{{ p.btnColor }};font-weight:700;font-size:14px;cursor:pointer\">{{ p.btnLabel }}<\u002Fbutton><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"legal\" style=\"max-width:1180px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:56px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<span style=\"font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--r);font-weight:700\">Dpto. 04 \u00b7 Legal<\u002Fspan>\n<h2 style=\"margin:0;font-family:var(--h);font-size:clamp(30px,3.8vw,44px);line-height:1.1;letter-spacing:-.02em\">La letra peque\u00f1a. <span class=\"hl\">M\u00e1s all\u00e1 de la PM.<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;color:var(--m);font-size:17px\">Lo que no cabe en un CV, pero tambi\u00e9n viene conmigo.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700;letter-spacing:.1em\">CHILE \u2192 MADRID<\u002Fspan><h3 style=\"margin:0;font-family:var(--h);font-size:clamp(22px,2.6vw,30px)\">Soy de Chile, pero hace 4 a\u00f1os vivo en Madrid.<\u002Fh3><p style=\"margin:0;font-size:17px;color:var(--m)\">Inicialmente me ven\u00eda solo por un a\u00f1o, pero las ca\u00f1as y las tapas me conquistaron.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--w);border:1px solid var(--line);border-radius:22px;padding:clamp(12px,2vw,20px)\">\n<svg sc-camel-view-box=\"0 0 720 270\" role=\"img\" aria-label=\"Mapamundi: un avi\u00f3n viaja de Santiago de Chile a Madrid\" style=\"width:100%;height:auto;display:block\">\n<path d=\"M135 0h0M159 0h0M165 0h0M189 0h0M195 0h0M201 0h0M219 0h0M225 0h0M231 0h0M237 0h0M243 0h0M249 0h0M255 0h0M261 0h0M267 0h0M273 0h0M279 0h0M285 0h0M291 0h0M297 0h0M303 0h0M309 0h0M315 0h0M387 0h0M393 0h0M405 0h0M135 6h0M141 6h0M147 6h0M171 6h0M177 6h0M183 6h0M189 6h0M195 6h0M249 6h0M255 6h0M261 6h0M267 6h0M273 6h0M279 6h0M285 6h0M291 6h0M297 6h0M303 6h0M309 6h0M315 6h0M477 6h0M537 6h0M543 6h0M549 6h0M555 6h0M561 6h0M567 6h0M573 6h0M579 6h0M585 6h0M639 6h0M645 6h0M657 6h0M111 12h0M117 12h0M123 12h0M129 12h0M135 12h0M141 12h0M147 12h0M159 12h0M165 12h0M183 12h0M189 12h0M195 12h0M201 12h0M207 12h0M255 12h0M261 12h0M267 12h0M273 12h0M279 12h0M285 12h0M291 12h0M297 12h0M303 12h0M309 12h0M465 12h0M471 12h0M501 12h0M513 12h0M519 12h0M525 12h0M531 12h0M537 12h0M543 12h0M549 12h0M555 12h0M561 12h0M567 12h0M573 12h0M579 12h0M585 12h0M591 12h0M597 12h0M603 12h0M609 12h0M615 12h0M639 12h0M645 12h0M651 12h0M657 12h0M33 18h0M39 18h0M45 18h0M51 18h0M57 18h0M63 18h0M69 18h0M75 18h0M81 18h0M9 font:700 13px Inter,sans-serif;fill:#18263B\">Madrid<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700;letter-spacing:.1em\">LA BIBLIOTECA<\u002Fspan><h3 style=\"margin:0;font-family:var(--h);font-size:clamp(22px,2.6vw,30px)\">Me gusta mucho leer, y sobre todo disfruto las novelas.<\u002Fh3><p style=\"margin:0;font-size:17px;color:var(--m)\">Aunque en mi estanter\u00eda tambi\u00e9n hay sitio para libros de empresa y de producto. Toca un lomo para saber por qu\u00e9 me gust\u00f3.<\u002Fp><\u002Fdiv>\n<div style=\"background:var(--w);border:1px solid var(--line);border-radius:22px;padding:28px 20px 0;overflow:hidden\">\n<div style=\"display:flex;align-items:flex-end;justify-content:center;gap:6px;min-height:250px;padding:0 8px;overflow-x:auto\">\n<span aria-hidden=\"true\" style=\"position:relative;display:block;flex:none;width:90px;height:180px\"><span style=\"position:absolute;left:50%;bottom:44px;width:20px;height:60px;margin-left:-10px;background:#5E8C6A;border-radius:50% 50% 50% 50% / 85% 85% 15% 15%;transform-origin:50% 100%;transform:rotate(-58deg)\"><\u002Fspan><span style=\"position:absolute;left:50%;bottom:44px;width:20px;height:60px;margin-left:-10px;background:#5E8C6A;border-radius:50% 50% 50% 50% / 85% 85% 15% 15%;transform-origin:50% 100%;transform:rotate(58deg)\"><\u002Fspan><span style=\"position:absolute;left:50%;bottom:44px;width:24px;height:94px;margin-left:-12px;background:#3F6B4E;border-radius:50% 50% 50% 50% / 85% 85% 15% 15%;transform-origin:50% 100%;transform:rotate(-28deg)\"><\u002Fspan><span style=\"position:absolute;left:50%;bottom:44px;width:24px;height:94px;margin-left:-12px;background:#3F6B4E;border-radius:50% 50% 50% 50% / 85% 85% 15% 15%;transform-origin:50% 100%;transform:rotate(28deg)\"><\u002Fspan><span style=\"position:absolute % / 85% 85% 15% 15%;transform-origin:50% 100%;transform:rotate(-14deg)\"><\u002Fspan><span style=\"position:absolute;left:50%;bottom:0;width:46px;height:42px;margin-left:-23px;background:#F3DC5A;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)\"><\u002Fspan><span style=\"position:absolute;left:50%;bottom:38px;width:54px;height:10px;margin-left:-27px;background:#18263B;border-radius:3px\"><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:14px;background:#8A6A45;margin:0 -20px;box-shadow:0 6px 0 #5C4630\"><\u002Fdiv>\n<\u002Fdiv>\n<div aria-live=\"polite\" style=\"background:var(--w);border:2px solid var(--t);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;animation:fadeup .25s ease\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700\">{{ book.typeLabel }}<\u002Fspan><strong style=\"font-family:var(--h);font-size:20px\">{{ book.t }}<\u002Fstrong><span style=\"font-size:14px;color:var(--m)\">{{ book.a }}<\u002Fspan><p style=\"margin:4px 0 0;font-size:16px\">{{ book.note }}<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--rl);border-radius:14px;padding:14px 18px\"><p style=\"margin:0;font-weight:600\">\u00bfQuieres ver m\u00e1s de mi biblioteca? Te invito a mi Goodreads.<\u002Fp><a href=\"https://www.goodreads.com/user/show/172711893\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"min-height:44px;padding:0 16px;border-radius:10px;background:var(--t);color:var(--w);font-weight:700;display:flex;align-items:center;text-decoration:none\">Ir a Goodreads \u2197<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--mono);font-size:12px;color:var(--r);font-weight:700;letter-spacing:.1em\">LA M\u00daSICA<\u002Fspan><h3 style=\"margin:0;font-family:var(--h);font-size:clamp(22px,2.6vw,30px)\">La m\u00fasica me acompa\u00f1a siempre.<\u002Fh3><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px\">\n<article style=\"position:relative;overflow:hidden;isolation:isolate;background:#0F1928;color:var(--w);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px\">\n<img src=\"abbey-road.jpg\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;opacity:.38;z-index:-1\">\n<span style=\"font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--y)\">LOS BEATLES, MI BANDA FAVORITA<\u002Fspan>\n<p style=\"margin:0;font-size:20px;line-height:1.45;font-weight:700;font-family:var(--h)\"><span style=\"color:var(--y)\">Infidencia:<\u002Fspan> cuando me cas\u00e9, entr\u00e9 a la iglesia con una versi\u00f3n instrumental de \u00abIn My Life\u00bb.<\u002Fp>\n<a href=\"https://www.youtube.com/watch?v=hrGalHErMus\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-top:auto;align-self:flex-start;min-height:44px;padding:0 18px;border-radius:10px;background:var(--y);color:var(--t);font-weight:700;display:flex;align-items:center;text-decoration:none\">Esc\u00fachala aqu\u00ed \u2197<\u002Fa>\n<p style=\"margin:0;font-size:11px;opacity:.85\">Foto: m.caimary \u00b7 <a href=\"https://creativecommons.org/licenses/by/2.0/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:var(--y)\">CC BY 2.0<\u002Fa><\u002Fp>\n<\u002Farticle>\n<article style=\"position:relative;overflow:hidden;isolation:isolate;background:#0F1928;color:var(--w);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px\">\n<img src=\"c7ae6845-a2cf-479f-bfdd-cceb9812349d\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 35%;opacity:.38;z-index:-1\">\n<span style=\"font-family:var(--mono);font-size:12px;font-weigh  ['Priorizar el roadmap de contabilizaci\u00f3n y conciliaci\u00f3n',['contable']],\n  ['Negociar con perfiles t\u00e9cnicos senior: acuerdos, no conflictos',['laboral']],\n  ['Lanzar, medir y demostrar que cada mejora ahorra horas',['fiscal']],\n  ['Valorable: software contable o de facturaci\u00f3n',['fiscal']],\n  ['Ambici\u00f3n, confianza, curiosidad y pasi\u00f3n',['legal']]\n].map((x,i)=>({id:'d'+i,text:x[0],depts:x[1]}));\nconst STEPS = [\n  {code:'01 \u00b7 Apertura',title:'Discovery + benchmarking',debe:'Combino entrevistas, datos de uso y feedback de soporte con el an\u00e1lisis de otros agentes de IA y de la competencia.',haber:'Saber d\u00f3nde pierden tiempo los usuarios y qu\u00e9 podr\u00eda resolver el agente mejor que nadie.'},\n  {code:'02 \u00b7 Asiento',title:'Caso de uso ag\u00e9ntico',debe:'Convierto cada fricci\u00f3n en un caso de uso que el usuario pide en lenguaje natural, con la hip\u00f3tesis y el resultado que esperamos.',haber:'Un objetivo claro y medible: qu\u00e9 tarea debe completar el agente y c\u00f3mo sabremos que lo hace bien.'},\n  {code:'03 \u00b7 Conciliaci\u00f3n',title:'Prototipado y documentaci\u00f3n',debe:'Prototipamos con IA y lo validamos con usuarios. La especificaci\u00f3n y los requerimientos ya no se escriben a mano: los genera la IA a partir del prototipo validado.',haber:'Llegar a desarrollo con algo probado y bien especificado, sin semanas de documentaci\u00f3n.'},\n  {code:'04 \u00b7 Registro',title:'Priorizar y construir',debe:'Priorizo roadmap y backlog con Ingenier\u00eda, Data y negocio por impacto y esfuerzo, y lidero las ceremonias en un equipo que desarrolla acelerado con IA.',haber:'Ciclos cortos y un equipo que sabe qu\u00e9 construye y por qu\u00e9, con los trade-offs claros.'},\n  {code:'05 \u00b7 Cierre',title:'Medir y vigilar',debe:'Mido el uso frente a la North Star y sus guardrails, y la calidad del agente con evals, trazas y QA multiagente cada d\u00eda.',haber:'Decidir con datos qu\u00e9 escalar, qu\u00e9 corregir y qu\u00e9 priorizar\u2026 y abrir el siguiente ciclo.'}\n];\nconst BOXES = [\n  {code:'01',title:'North Star Metric',text:'Alineada con el valor que obtiene el usuario, no con el uso por el uso. Para un agente, el valor es que resuelva tareas y que el usuario vuelva a confiarle otras.',ex:'Usuarios con al menos una tarea exitosa en la semana y al menos otra en alguna de las tres semanas anteriores.'},\n  {code:'02',title:'M\u00e9tricas de input',text:'Las palancas que el equipo s\u00ed puede mover y que empujan la North Star. Son las que miramos cada semana.',ex:'% de usuarios nuevos con una tarea exitosa en sus primeros 7 d\u00edas \u00b7 % de usuarios que vuelven al agente y tienen \u00e9xito \u00b7 usuarios activos semanales.'},\n  {code:'03',title:'Guardrails',text:'Protegen la calidad y la experiencia. En contabilidad un error cuesta confianza, as\u00ed que crecer nunca puede romper eso.',ex:'Tasa de \u00e9xito de tareas \u00b7 errores, stops y latencia \u00b7 acciones fuera de permiso.'},\n  {code:'04',title:'Resultado y decisi\u00f3n',text:'Con los datos de uso decido qu\u00e9 escalar, qu\u00e9 corregir y qu\u00e9 priorizar, y lo comunico con transparencia.',ex:'Si la North Star crece y los guardrails aguantan: ampliar casos de uso. Si cae la tasa de \u00e9xito o aparecen acciones fuera de permiso: corregir antes de escalar.'}\n];\nconst BOOKS = [\n  {id:'b6',t:'The Lean Startup',a:'Eric Ries',type:'empresa',bg:'#FFFDF8',fg:'#18263B',band:'#F3DC5A',h:196,w:54,note:'Me dej\u00f3 la disciplina de validar hip\u00f3tesis con experimentos peque\u00f1os antes de invertir mucho.'},\n  {id:'b8',t:'Storytelling',a:'Carlos Salas',type:'empresa',bg:'#18263B',fg:'#FFFDF8',band:'#F3DC5A',h:200,w:52,note:'Me ayud\u00f3 a contar mejor las decisiones de producto: una buena historia alinea a un equipo m\u00e1s r\u00e1pido que una lista de datos.'},\n  {id:'b9',t:'Mide lo que importa',a:'John Doerr',type:'empresa',bg:'#2D5BD3',fg:'#FFFDF8',band:'#E3EAFB',h:222,w:58,note:'Un marco claro para conectar objetivos con resultados medibles y no perder de vista lo que de verdad mueve la aguja.'},\n  {id:'b4',t:'Product-Led Growth',a:'Wes Bush',type:'producto',bg:'#E3EAFB',fg:'#18263B',band:'#2D5BD3',h:204,w:52,note:'Me ense\u00f1\u00f3 a ver el producto como el principal motor para atraer, activar y hacer crecer a los usuarios.'},\n  {id:'b5',t:'Inspired',a:'Marty Cagan',type:'producto',bg:'#B3261E',fg:'#FFFDF8',band:'#FFFDF8',h:216,w:56,note:'Me marc\u00f3 la idea de equipos de producto empoderados que resuelven problemas en lugar de ejecutar features, y la importancia del discovery continuo.'},\n  {id:'b7',t:'The Mom Test',a:'Rob Fitzpatrick',type:'producto',bg:'#F3DC5A',fg:'#18263B',band:'#18263B',h:184,w:50,note:'Me ense\u00f1\u00f3 a entrevistar sin sesgar: preguntar por lo que la gente hace de verdad, no por lo que dir\u00eda que har\u00eda.'},\n  {id:'b1',t:'Victoria',a:'Paloma S\u00e1nchez-Garnica',type:'novela',bg:'#3F6B4E',fg:'#FFFDF8',band:'#F3DC5A',h:228,w:58,note:'Una novela hist\u00f3rica que disfrut\u00e9 por su ritmo y por c\u00f3mo pone a las personas, con sus dudas y decisiones dif\u00edciles, en el centro.'},\n  {id:'b2',t:'Dime qui\u00e9n soy',a:'Julia Navarro',type:'novela',bg:'#F6E3DF',fg:'#18263B',band:'#B3261E',h:242,w:66,note:'Me atrap\u00f3 c\u00f3mo recorre la Europa convulsa del siglo XX con esp\u00edas, amores y secretos, y c\u00f3mo uno va armando el rompecabezas.'},\n  {id:'b3',t:'La verdad sobre el caso Harry Quebert',a:'Jo\u00ebl Dicker',type:'novela',bg:'#0F1928',fg:'#FFFDF8',band:'#B3261E',h:236,w:64,note:'Un thriller en el que cada cap\u00edtulo cambia lo que cre\u00edas saber: formular hip\u00f3tesis y descartarlas, muy cerca de mi trabajo.'}\n];\nconst TYPE_LABEL = {empresa:'EMPRESA',producto:'PRODUCTO',novela:'NOVELA'};\nconst QA = [\n  {code:'Agente 1',title:'Pruebas',text:'Cada d\u00eda ejecuta pruebas automatizadas sobre Alegra Bot, simulando lo que piden los usuarios.'},\n  {code:'Agente 2',title:'Diagn\u00f3stico',text:'Analiza las trazas de cada fallo para encontrar la causa ra\u00edz, en lugar de quedarse en el s\u00edntoma.'},\n  {code:'Agente 3',title:'Tarea',text:'Redacta la tarea para desarrollo con el contexto del fallo y su causa.'},\n  {code:'Resultado',title:'Backlog',text:'Se acorta al m\u00ednimo el tiempo entre que aparece un error y que se prioriza en el backlog.'}\n];\nconst EDU = [\n  {t:'AI Strategy',o:'Reforge',d:'en curso'},{t:'Mastering Retention & Engagement',o:'Reforge',d:'feb 2026'},\n  {t:'Product Management',o:'Platzi',d:'mar 2025'},{t:'Amplitude Foundations',o:'Amplitude',d:'feb 2025'},{t:'Scrum Foundation',o:'CertiProf',d:'feb 2025'}\n];\nconst NAV = [['recepcion','Recepci\u00f3n'],['requerimiento','Requerimiento'],['contable','Contable'],['fiscal','Fiscal'],['laboral','Laboral'],['ventanilla','Ventanilla IA'],['legal','Legal'],['facturacion','Factura']];\nconst CONCERT = Date.UTC(2027,6,23,16,0,0);\nconst PROD_START = new Date(2025,0,1).getTime();\nconst pad = n => String(n).padStart(2,'0');\nconst guessDept = t => { const s=t.toLowerCase();\n  if(/\\b(ia|ai)\\b|agente|prototip|automat|llm|claude|chatbot/.test(s)) return 'ventanilla';\n  if(/m\u00e9tric|metric|dato|data|anal\u00edt|experiment|a\\/b|fiscal|impuest|iva|contab|factura/.test(s)) return 'fiscal';\n  if(/n\u00f3mina|nomina|laboral|rrhh|personas|equipo|stakeholder|comunica|lideraz|talento|experiencia/.test(s)) return 'laboral';\n  if(/libro|lectur|curios|idioma|ingl\u00e9s|cultur|hobby|f1|m\u00fasica|aprend/.test(s)) return 'legal';\n  return 'contable'; };\n\nclass Component extends DCLogic {\n  state = { list:DEFAULT_LIST.map(x=>({...x})), exp:[], step:0, qa:0, box:0, promptOpen:false, book:'b5', active:'recepcion', now:Date.now(), f1:{phase:'idle',lit:0,ms:null,best:null}, seal:0, stamped:false, toast:null };\n  componentDidMount(){ this.tick=setInterval(()=>this.setState({now:Date.now()}),1000); }\n  addReq(){ const v=(this.reqEl&&this.reqEl.value||'').trim(); if(!v) return; const d=guessDept(v); this.setState(st=>({list:[...st.list,{id:'c'+Date.now(),text:v,depts:[d]}]})); this.reqEl.value=''; this.flash('Anotado. Lo atiende: '+DNAME[d]); }\n  copy(text,label){ const done=()=>this.flash(label+' copiado: '+text); const fb=()=>{ try{ const t=document.createElement('textarea'); t.value=text; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(e){} done(); };\n    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fb); } else fb(); }catch(e){ fb(); } }\n  componentWillUnmount(){ clearInterval(this.tick); this.f1Clear(); clearTimeout(this.tT); clearTimeout(this.sT); }\n  flash(msg){ clearTimeout(this.tT); this.setState({toast:msg}); this.tT=setTimeout(()=>this.setState({toast:null}),2800); }\n  toggle(id){ const has=this.state.exp.includes(id);\n    this.setState({exp:has?this.state.exp.filter(x=>x!==id):[...this.state.exp,id]});\n    if(!has) this.flash('A\u00f1adido al expediente: '+P[id].n); }\n  f1Clear(){ clearInterval(this.f1i); clearTimeout(this.f1t); }\n  f1Press = () => { const f=this.state.f1;\n    if(f.phase==='lights'){ this.f1Clear(); this.setState({f1:{...f,phase:'false',lit:0}}); return; }\n    if(f.phase==='go'){ const ms=Math.round(performance.now()-this.t0); this.setState({f1:{...f,phase:'result',ms,best:f.best==null?ms:Math.min(f.best,ms)}}); return; }\n    this.f1Clear(); this.setState({f1:{...f,phase:'lights',lit:0,ms:null}}); let n=0;\n    this.f1i=setInterval(()=>{ n++; this.setState(st=>({f1:{...st.f1,lit:n}}));\n      if(n>=5){ clearInterval(this.f1i); this.f1t=setTimeout(()=>{ this.t0=performance.now(); this.setState(st=>({f1:{...st.f1,phase:'go',lit:0}})); },300+Math.random()*2700); } },900); };\n  f1Msg(ms){ if(ms<150) return '\u00bfSeguro que no te adelantaste? Nivel campe\u00f3n del mundo.'; if(ms<230) return '\u00a1Reflejos de pole position!'; if(ms<320) return 'Buen tiempo: puntos asegurados.'; if(ms<450) return 'Correcto, pero desde el muro piden m\u00e1s ritmo.'; return 'Tiempo de vuelta de formaci\u00f3n. \u00a1Otra!'; }\n  sealClick = () => { const n=this.state.seal+1; clearTimeout(this.sT);\n    if(n<5){ this.setState({seal:n}); this.sT=setTimeout(()=>this.setState({seal:0}),2500); return; }\n    this.setState({seal:0,stamped:true}); this.flash('Easter egg: las cuentas cuadran.'); this.sT=setTimeout(()=>this.setState({stamped:false}),4000); };\n  todayStr(){ const d=new Date(); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }\n  renderVals(){\n    const s=this.state;\n    const card=(id,dept,i)=>{ const on=s.exp.includes(id); return {...P[id],id,ref:PREFIX[dept]+'-'+pad(i+1),pressed:String(on),toggle:()=>this.toggle(id),\n      btnLabel:on?'En el expediente \u2713':'A\u00f1adir al expediente',btnBg:on?'#E3EAFB':'#18263B',btnColor:on?'#2D5BD3':'#FFFDF8',btnBorder:on?'1.5px solid #2D5BD3':'none',\n      darkBg:on?'#F3DC5A':'#FFFDF8',darkColor:'#18263B'}; };\n    const dep=k=>DEPTS[k].map((id,i)=>card(id,k,i));\n    const lit=s.f1.lit, ph=s.f1.phase, f1={best:s.f1.best!=null?'Mejor: '+s.f1.best+' ms':'Mejor: \u2014'};\n    for(let i=1;i<=5;i++) f1['c'+i]=(ph==='lights'&&lit>=i)?'#E5484D':'#2B3A52';\n    if(ph==='idle'){f1.big='\u00bfListo?';f1.msg='Pulsa para empezar.';}\n    else if(ph==='lights'){f1.big='\u2026';f1.msg='Espera a que se apaguen todas.';}\n    else if(ph==='go'){f1.big='\u00a1YA!';f1.msg='\u00a1Pulsa ahora!';}\n    else if(ph==='false'){f1.big='Salida en falso';f1.msg='Penalizaci\u00f3n de 5 segundos. Pulsa para repetir.';}\n    else {f1.big=s.f1.ms+' ms';f1.msg=this.f1Msg(s.f1.ms)+' Pulsa para repetir.';}\n    const diff=Math.max(0,Math.floor((CONCERT-s.now)/1000));\n    const cd={d:Math.floor(diff/86400),h:pad(Math.floor(diff%86400/3600)),m:pad(Math.floor(diff%3600/60)),s:pad(diff%60)};\n    const bk=BOOKS.find(b=>b.id===s.book);\n    const expItems=s.exp.map(id=>({n:P[id].n}));\n    return {\n      nav:NAV.map(([id,label])=>{ const on=s.active===id; return {label,href:'#'+id,current:on?'true':'false',bg:on?'#18263B':'transparent',color:on?'#FFFDF8':'#18263B',go:()=>this.setState({active:id})}; }),\n      list:s.list.map((it,i)=>({...it,num:pad(i+1),removeLabel:'Eliminar '+it.text,remove:()=>this.setState(st=>({list:st.list.filter(x=>x.id!==it.id)})),chips:it.depts.map(d=>({label:'Lo atiende: '+DNAME[d],href:'#'+d}))})),\n      reqRef:el=>{this.reqEl=el;}, reqKey:e=>{ if(e.key==='Enter'){ e.preventDefault(); this.addReq(); } },\n      addItem:()=>this.addReq(),\n      resetList:()=>this.setState({list:DEFAULT_LIST.map(x=>({...x}))}),\n      steps:STEPS.map((x,i)=>{ const on=s.step===i; return {...x,sel:String(on),border:on?'#18263B':'rgba(24,38,59,.14)',bg:on?'#18263B':'#F4EFE4',color:on?'#FFFDF8':'#18263B',pick:()=>this.setState({step:i})}; }),\n      step:STEPS[s.step], stepNum:s.step+1, stepPct:((s.step+1)*20)+'%',\n      prevStep:()=>this.setState(st=>({step:(st.step+4)%5})), nextStep:()=>this.setState(st=>({step:(st.step+1)%5})),\n      boxes:BOXES.map((b,i)=>{ const on=s.box===i; return {...b,sel:String(on),border:on?'#2D5BD3':'rgba(24,38,59,.25)',bg:on?'#E3EAFB':'#FFFFFF',pick:()=>this.setState({box:i})}; }),\n      promptOpen:s.promptOpen, promptOpenStr:String(s.promptOpen), promptSign:s.promptOpen?'\u2212':'+', togglePrompt:()=>this.setState(st=>({promptOpen:!st.promptOpen})),\n      box:BOXES[s.box],\n      qaSteps:QA.map((x,i)=>{ const on=s.qa===i; return {...x,sel:String(on),border:on?'#2D5BD3':'rgba(24,38,59,.14)',bg:on?'#2D5BD3':'#FFFFFF',color:on?'#FFFFFF':'#18263B',pick:()=>this.setState({qa:i})}; }), qaCur:QA[s.qa],\n      books:BOOKS.map(b=>{ const on=s.book===b.id; return {...b,h:b.h+'px',w:b.w+'px',lift:on?'14px':'0px',sel:String(on),aria:b.t+', de '+b.a,pick:()=>this.setState({book:b.id})}; }),\n      book:{...bk,typeLabel:TYPE_LABEL[bk.type]}, edu:EDU,\n      diasProducto:Math.max(0,Math.floor((s.now-PROD_START)/86400000)),\n      dContable:dep('contable'), dFiscal:dep('fiscal'), dLaboral:dep('laboral'), dIA:dep('ventanilla'), dLegal:dep('legal'),\n      f1, f1Press:this.f1Press, cd,\n      expItems, expHas:expItems.length>0, expEmpty:expItems.length===0, expCount:s.exp.length, expAria:'Ver expediente y factura, '+s.exp.length+' partidas',\n      sealClick:this.sealClick, copyMail:()=>this.copy('jcerpamonrroy@gmail.com','Correo'), copyPhone:()=>this.copy('+34 657 257 996','Tel\u00e9fono'), stamped:s.stamped, today:this.todayStr(), toast:s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
